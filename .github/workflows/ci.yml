name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Core and server (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  android:
    name: Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Android platforms available
        run: |
          ls "$ANDROID_HOME/platforms" || true
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          "$SDKMANAGER" --list 2>/dev/null | grep -E "platforms;android-3[6-9]" | sort -u || true
      - uses: gradle/actions/setup-gradle@v4
      - name: Firebase config (optional)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        if: env.GOOGLE_SERVICES_JSON != ''
        run: echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
      - name: Build debug and release APKs
        working-directory: android
        env:
          MAMI_SERVER_URL: ${{ vars.MAMI_SERVER_URL }}
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          ./gradlew --no-daemon assembleDebug assembleRelease "-Pmami.serverUrl=$MAMI_SERVER_URL"
      - name: Check the APK
        run: |
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$apk" | grep -E 'lib/.*\.so$'
          for abi in arm64-v8a armeabi-v7a x86_64; do
            unzip -l "$apk" | grep -q "lib/$abi/libmami_core.so" || { echo "missing core for $abi"; exit 1; }
          done
          if unzip -l "$apk" | grep -E 'lib/(x86|armeabi|mips|mips64)/'; then echo "unexpected ABI packaged"; exit 1; fi
          libs=$(find android/app/build -path '*merged_native_libs*' -name 'libmami_core.so')
          test -n "$libs" || { echo "no native libraries found"; exit 1; }
          for so in $libs; do
            echo "$so"
            readelf -lW "$so" | awk '/LOAD/ { if ($NF != "0x4000") { print "not 16 KB aligned"; exit 1 } }'
          done
      - uses: actions/upload-artifact@v4
        with:
          name: mami-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
