name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Core and server (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  android:
    name: Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager "platforms;android-37"
      - uses: gradle/actions/setup-gradle@v4
      - name: Firebase config (optional)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        if: env.GOOGLE_SERVICES_JSON != ''
        run: echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
      - name: Build debug APK
        working-directory: android
        env:
          MAMI_SERVER_URL: ${{ vars.MAMI_SERVER_URL }}
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          ./gradlew --no-daemon assembleDebug "-Pmami.serverUrl=$MAMI_SERVER_URL"
      - name: Check 16 KB page alignment
        run: |
          for so in $(find android/app/build -path '*merged_native_libs*' -name 'libmami_core.so'); do
            echo "$so"
            readelf -lW "$so" | awk '/LOAD/ { if ($NF != "0x4000") { print "misaligned"; exit 1 } }'
          done
      - uses: actions/upload-artifact@v4
        with:
          name: mami-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
