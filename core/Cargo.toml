[package]
name = "mami-core"
version = "0.1.0"
description = "Shared end-to-end encryption and protocol core for the MaMi apps"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["lib", "cdylib", "staticlib"]
name = "mami_core"

[dependencies]
base64 = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
uniffi = "0.32"
vodozemac = "0.11"
zeroize = "1"
